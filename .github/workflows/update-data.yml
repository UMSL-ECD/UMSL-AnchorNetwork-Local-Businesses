name: Update business directory data

# Runs automatically whenever Ref-Directory.csv changes on this branch,
# and can also be triggered manually from the Actions tab ("Run workflow").
on:
  push:
    paths:
      - "Ref-Directory.csv"
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only unless a job explicitly asks for
# more. Without this, "git push" below fails with exit code 128.
permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate businesses.json from Ref-Directory.csv
        run: python scripts/prepare_data.py

      - name: Commit and push if businesses.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add businesses.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-update businesses.json from Ref-Directory.csv"
          git push
